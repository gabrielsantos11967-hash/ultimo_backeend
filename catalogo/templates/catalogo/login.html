<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Lanchonete do Bairro</title>
    <style>
        body { max-width: 520px; margin: 3rem auto; padding: 0 1rem; font-family: Arial, sans-serif; color: #242424; }
        label { display: grid; gap: 0.35rem; margin: 1rem 0; }
        input { padding: 0.65rem; }
        button, .button { display: inline-block; padding: 0.7rem 1rem; border: 0; border-radius: 0.35rem; color: #fff; background: #8b2f20; text-decoration: none; cursor: pointer; }
        .error { color: #9b1c1c; }
    </style>
</head>
<body>
    <h1>Entrar como cliente</h1>
    {% if messages %}
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
    {% endif %}
    {% if form.errors %}
        <p class="error">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label>
            Usuário
            {{ form.username }}
        </label>
        <label>
            Senha
            {{ form.password }}
        </label>
        <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="{% url 'cadastro_cliente' %}">Criar conta</a></p>
    <p><a href="{% url 'home' %}">Voltar ao cardápio</a></p>
</body>
</html>
